name: macOS Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: make pristine && make BINARY=UNIVERSAL

    - name: Pack artifacts
      run: zip -r "KvaserCAN-${GITHUB_REF_NAME}.zip" Binaries Includes README.md LICENSE.*

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" "KvaserCAN-${GITHUB_REF_NAME}.zip" --draft --generate-notes --title "Release of $(date '+%B %-d, %Y')"
